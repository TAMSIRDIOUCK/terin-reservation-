<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TerrainPlus</title>

    <!-- Icône pour l'app sur téléphone -->
    <link rel="icon" href="../assets/image.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="../assets/image.png" />

    <!-- Manifest pour PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Meta pour réseaux sociaux -->
    <meta property="og:title" content="TerrainPlus" />
    <meta property="og:description" content="Réservez vos terrains facilement et rapidement." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />

    <!-- Theme color pour navigateur -->
    <meta name="theme-color" content="#4ade80" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Script principal -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Enregistrement du service worker pour PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => console.log('Service Worker registered', registration))
            .catch(err => console.error('Service Worker failed', err));
        });
      }
    </script>
  </body>
</html>
